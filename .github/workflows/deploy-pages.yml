name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/customer-purchase-search-IDjP8
      - claude/claude-code-usage-01YS33uX6EQqXRxwtU99Qx1e
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: customer-search/package-lock.json
      - name: Install dependencies
        working-directory: customer-search
        run: npm ci
      - name: Build
        working-directory: customer-search
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: customer-search/dist
